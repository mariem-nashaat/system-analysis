<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Me</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Website</h1>
    <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
</nav>
  </header>

  <main>
    <h2>Contact Me</h2>
    <p>Fill out the form below and I will get back to you soon.</p>

    <form action="#" method="post">
      <label for="fullname">Full Name (Text)</label>
      <input type="text" id="fullname" name="fullname" placeholder="Your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="age">Age (Number)</label>
      <input type="number" id="age" name="age" min="1" max="120">

      <label for="birthdate">Date</label>
      <input type="date" id="birthdate" name="birthdate">

      <fieldset>
        <legend>Preferred contact method (Radio buttons)</legend>
        <label for="contact-email">
          <input type="radio" id="contact-email" name="contact_method" value="email" checked> Email
        </label>
        <label for="contact-phone">
          <input type="radio" id="contact-phone" name="contact_method" value="phone"> Phone
        </label>
        <label for="contact-chat">
          <input type="radio" id="contact-chat" name="contact_method" value="chat"> Chat
        </label>
      </fieldset>

      <fieldset>
        <legend>Topics of interest (Checkboxes)</legend>
        <label for="topic-web">
          <input type="checkbox" id="topic-web" name="topics" value="web"> Web Design
        </label>
        <label for="topic-db">
          <input type="checkbox" id="topic-db" name="topics" value="databases"> Databases
        </label>
        <label for="topic-ai">
          <input type="checkbox" id="topic-ai" name="topics" value="ai"> AI
        </label>
      </fieldset>

      <label for="subject">Subject (Dropdown menu)</label>
      <select id="subject" name="subject">
        <option value="">-- Choose a subject --</option>
        <option value="question">General question</option>
        <option value="feedback">Feedback</option>
        <option value="collaboration">Collaboration</option>
        <option value="other">Other</option>
      </select>

      <label for="message">Message (Textarea)</label>
      <textarea id="message" name="message" rows="6" placeholder="Write your message here..."></textarea>

      <button type="submit">submit</button>
    </form>
  </main>

  <footer>
    <p> created by mariem nashaat.</p>
  </footer>

</body>
</html>
